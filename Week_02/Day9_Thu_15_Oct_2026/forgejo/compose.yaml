services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:16
    container_name: forgejo
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__server__DOMAIN=lbgxteam.site
      - FORGEJO__server__ROOT_URL=https://lbgxteam.site/
      - FORGEJO__server__SSH_DOMAIN=lbgxteam.site
      - FORGEJO__server__SSH_PORT=2222
    volumes:
      - ./data:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "127.0.0.1:3000:3000"
      - "2222:22"
