services:
  backend:
    image: python:3.12-slim
    command: sh -c "pip install -q pymysql && python /app/server.py"
    volumes:
      - ./backend:/app:ro
    environment:
      DB_HOST: mysql
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      - mysql
    networks:
      - lab-net

networks:
  lab-net:
